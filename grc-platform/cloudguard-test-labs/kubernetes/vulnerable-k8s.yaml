apiVersion: v1
kind: Namespace
metadata:
  name: cloudguard-test
  labels:
    app.kubernetes.io/name: cloudguard-test
    cloudguard-test: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudguard-test-admin
  namespace: cloudguard-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudguard-test-cluster-admin
  labels:
    cloudguard-test: "true"
subjects:
  - kind: ServiceAccount
    name: cloudguard-test-admin
    namespace: cloudguard-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-nginx
  namespace: cloudguard-test
  labels:
    app: vulnerable-nginx
    cloudguard-test: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-nginx
  template:
    metadata:
      labels:
        app: vulnerable-nginx
    spec:
      serviceAccountName: cloudguard-test-admin
      automountServiceAccountToken: true
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
        - name: nginx
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-nodeport
  namespace: cloudguard-test
  labels:
    cloudguard-test: "true"
spec:
  type: NodePort
  selector:
    app: vulnerable-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-loadbalancer
  namespace: cloudguard-test
  labels:
    cloudguard-test: "true"
spec:
  type: LoadBalancer
  selector:
    app: vulnerable-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weak-allow-all-ingress
  namespace: cloudguard-test
  labels:
    cloudguard-test: "true"
spec:
  podSelector:
    matchLabels:
      app: vulnerable-nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: dummy-secret
  namespace: cloudguard-test
  labels:
    cloudguard-test: "true"
type: Opaque
data:
  username: ZHVtbXk=
  password: ZHVtbXktcGFzc3dvcmQtbm90LXJlYWw=
