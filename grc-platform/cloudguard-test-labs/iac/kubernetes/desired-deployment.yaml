apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-drift-app
  namespace: cloudguard-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudguard-drift-app
  template:
    metadata:
      labels:
        app: cloudguard-drift-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: nginx:1.25
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
