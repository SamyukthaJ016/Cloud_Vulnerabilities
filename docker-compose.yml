version: "3.9"

services:
  # --------------------------------------------------
  # POSTGRES DATABASE
  # --------------------------------------------------
  postgres:
    image: postgres:15
    container_name: cloudguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_pass}
      POSTGRES_DB: ${POSTGRES_DB:-scanner_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # --------------------------------------------------
  # REDIS (WITH PASSWORD)
  # --------------------------------------------------
  redis:
    image: redis:7
    container_name: cloudguard_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # --------------------------------------------------
  # BACKEND (PRODUCTION)
  # --------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD:-scanner_pass}@postgres:5432/${POSTGRES_DB:-scanner_db}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      # JWT AUTH
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: 6

      # App
      ENV: production
      PYTHONPATH: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000

  # --------------------------------------------------
  # BACKEND (DEV)
  # --------------------------------------------------
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard_backend_dev
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD:-scanner_pass}@postgres:5432/${POSTGRES_DB:-scanner_db}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: 6

      ENV: development
      PYTHONPATH: /app
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # --------------------------------------------------
  # SCHEDULER WORKER
  # --------------------------------------------------
  scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard_scheduler_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD:-scanner_pass}@postgres:5432/${POSTGRES_DB:-scanner_db}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: 6

      ENV: production
      PYTHONPATH: /app
    volumes:
      - .:/app
    command: >
      python -m backend.scheduler_worker

volumes:
  postgres_data:
  redis_data:
