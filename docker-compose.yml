services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: security-scanner-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scanner_db}
      POSTGRES_USER: ${POSTGRES_USER:-scanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner_user -d scanner_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - security-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: security-scanner-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - security-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ==========================================================================
  # Backend API (Development)
  # ==========================================================================
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      #cache_from:
        #- security-scanner-backend:latest
    container_name: security-scanner-backend-dev
    environment:
      # Database
      DATABASE_URL: postgresql://scanner_user:scanner_pass@postgres:5432/scanner_db

      # Redis
      REDIS_URL: redis://:redis_password@redis:6379/0

      # Queue and worker dispatch
      QUEUE_BACKEND: ${QUEUE_BACKEND:-postgres}
      SCAN_JOB_INLINE_WORKER: ${SCAN_JOB_INLINE_WORKER:-true}
      WORKER_AUTH_REQUIRED: ${WORKER_AUTH_REQUIRED:-false}
      WORKER_TOKEN: ${WORKER_TOKEN:-}

      # Optional AWS scan-target fallback. Prefer adding cloud credentials in the UI.
      AWS_ASSUME_ROLE_ARN: ${AWS_ASSUME_ROLE_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      # Optional S3-compatible evidence storage, including DigitalOcean Spaces.
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cloudguard/evidence}

      # GCP
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-/app/config/gcp-service-account.json}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}

      # Application
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # Security
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}

      # Feature Flags
      ENABLE_DEEP_SCAN: ${ENABLE_DEEP_SCAN:-true}
      ENABLE_VULNERABILITY_SCAN: ${ENABLE_VULNERABILITY_SCAN:-true}

      # Python
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend:rw
      - ./frontend:/app/frontend:ro
      - ./config:/app/config:ro
      - ./reports:/app/reports:rw
      - ./logs:/app/logs:rw
      - ./db/init:/app/db/init:ro

    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  # ==========================================================================
  # Scheduler Worker (runs scheduled scans)
  # ==========================================================================
  scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: scheduler-worker
    command: ["python", "-m", "backend.scheduler_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-dev:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://scanner_user:scanner_pass@postgres:5432/scanner_db
      REDIS_URL: redis://:redis_password@redis:6379/0
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      AWS_ASSUME_ROLE_ARN: ${AWS_ASSUME_ROLE_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-/app/config/gcp-service-account.json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      APP_ENV: scheduler
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    volumes:
      - ./backend:/app/backend:rw
      - ./config:/app/config:ro
      - ./logs:/app/logs:rw
      - ./db/init:/app/db/init:ro

    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - dev

  # ==========================================================================
  # Backend API (Production)
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      #cache_from:
        #- security-scanner-backend:latest
    container_name: security-scanner-backend
    environment:
      DATABASE_URL: postgresql://scanner_user:scanner_pass@postgres:5432/scanner_db
      REDIS_URL: redis://:redis_password@redis:6379/0
      QUEUE_BACKEND: ${QUEUE_BACKEND:-postgres}
      SCAN_JOB_INLINE_WORKER: ${SCAN_JOB_INLINE_WORKER:-true}
      WORKER_AUTH_REQUIRED: ${WORKER_AUTH_REQUIRED:-false}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cloudguard/evidence}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ENABLE_DEEP_SCAN: ${ENABLE_DEEP_SCAN:-true}
      ENABLE_VULNERABILITY_SCAN: ${ENABLE_VULNERABILITY_SCAN:-true}
    volumes:
      - ./config:/app/config:ro
      - ./reports:/app/reports:rw
      - ./logs:/app/logs:rw
      - ./db/init:/app/db/init:ro
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - prod

  # ==========================================================================
  # Trivy Server (for faster scanning)
  # ==========================================================================
  trivy-server:
    image: aquasec/trivy:latest
    container_name: trivy-server
    command: ["server", "--listen", "0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - trivy_cache:/root/.cache/trivy
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - scanning
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ==========================================================================
  # Scheduled Vulnerability Scanner (legacy profile; prefer scheduler-worker)
  # ==========================================================================
  scheduled-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: scheduled-scanner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD:-scanner_pass}@postgres:5432/${POSTGRES_DB:-scanner_db}
      AWS_ASSUME_ROLE_ARN: ${AWS_ASSUME_ROLE_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SCAN_SCHEDULE: ${SCAN_SCHEDULE:-0 2 * * *}
    volumes:
      - ./reports:/app/reports:rw
      - ./logs:/app/logs:rw
    depends_on:
      - postgres
      - backend
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - scanning
    command: ["python", "backend/scripts/scheduled_scan.py"]

  # ==========================================================================
  # CloudFox (optional AWS scan-target enumeration)
  # ==========================================================================
  cloudfox:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cloudfox
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-/app/config/gcp-service-account.json}
    volumes:
      - ./config:/app/config:ro
      - ./reports:/app/reports:rw
      - ./logs:/app/logs:rw
    networks:
      - security-network
    restart: "no"
    profiles:
      - scanning
    entrypoint: ["cloudfox"]
    command: ["aws", "-p", "default", "all-checks"]

  # ==========================================================================
  # Prometheus (Metrics)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ==========================================================================
  # Grafana (Visualization)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ==========================================================================
  # Jaeger (Distributed Tracing)
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - security-network
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

# =============================================================================
# Networks
# =============================================================================
networks:
  security-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  gcp_credentials:
    driver: local
  trivy_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
