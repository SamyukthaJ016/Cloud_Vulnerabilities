name: Publish Marp Workshop Deck

on:
  push:
    branches: [main]
    paths:
      - "workshop/marp-demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marp-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build HTML deck
        run: |
          mkdir -p public
          npx --yes @marp-team/marp-cli \
            workshop/marp-demo/cloudguard-workshop-demo.md \
            --theme workshop/marp-demo/themes/cloudguard.css \
            --html \
            --allow-local-files \
            --output public/index.html

      - name: Build PDF export
        run: |
          npx --yes @marp-team/marp-cli \
            workshop/marp-demo/cloudguard-workshop-demo.md \
            --theme workshop/marp-demo/themes/cloudguard.css \
            --pdf \
            --allow-local-files \
            --output public/cloudguard-workshop-demo.pdf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
