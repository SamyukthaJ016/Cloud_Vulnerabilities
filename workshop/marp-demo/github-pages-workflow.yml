name: Publish Marp Workshop Deck

on:
  push:
    branches: [main]
    paths:
      - "workshop/marp-demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marp-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build HTML deck
        run: |
          mkdir -p public
          npx --yes @marp-team/marp-cli \
            workshop/marp-demo/deeptrustxai-cloud-security-2-day-workshop.md \
            --theme workshop/marp-demo/themes/deeptrustxai.css \
            --html \
            --allow-local-files \
            --output public/index.html

          npx --yes @marp-team/marp-cli \
            workshop/marp-demo/deeptrustxai-kubernetes-security-2-day-workshop.md \
            --theme workshop/marp-demo/themes/deeptrustxai.css \
            --html \
            --allow-local-files \
            --output public/kubernetes.html

      - name: Build PDF export
        run: |
          npx --yes @marp-team/marp-cli \
            workshop/marp-demo/deeptrustxai-cloud-security-2-day-workshop.md \
            --theme workshop/marp-demo/themes/deeptrustxai.css \
            --pdf \
            --allow-local-files \
            --output public/deeptrustxai-cloud-security-2-day-workshop.pdf

          npx --yes @marp-team/marp-cli \
            workshop/marp-demo/deeptrustxai-kubernetes-security-2-day-workshop.md \
            --theme workshop/marp-demo/themes/deeptrustxai.css \
            --pdf \
            --allow-local-files \
            --output public/deeptrustxai-kubernetes-security-2-day-workshop.pdf

      - name: Publish editable PPTX
        run: |
          cp \
            workshop/marp-demo/exports/deeptrustxai-cloud-security-2-day-workshop.pptx \
            public/deeptrustxai-cloud-security-2-day-workshop.pptx
          cp \
            workshop/marp-demo/exports/deeptrustxai-kubernetes-security-2-day-workshop.pptx \
            public/deeptrustxai-kubernetes-security-2-day-workshop.pptx

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
