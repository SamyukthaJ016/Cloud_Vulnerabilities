services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scanner_db}
      POSTGRES_USER: ${POSTGRES_USER:-scanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner_user} -d ${POSTGRES_DB:-scanner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET};
      exit 0;
      "

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QUEUE_BACKEND: postgres
      SCAN_JOB_INLINE_WORKER: "false"
      SANDBOX_LAB_INLINE_WORKER: "false"
      SANDBOX_LABS_ENABLED: ${SANDBOX_LABS_ENABLED:-true}
      SANDBOX_IAC_DEPLOY: ${SANDBOX_IAC_DEPLOY:-true}
      SANDBOX_AWS_DEPLOY: ${SANDBOX_AWS_DEPLOY:-false}
      SANDBOX_GCP_DEPLOY: ${SANDBOX_GCP_DEPLOY:-false}
      SANDBOX_KUBERNETES_DEPLOY: ${SANDBOX_KUBERNETES_DEPLOY:-false}
      SANDBOX_LAB_BASE_DIR: ${SANDBOX_LAB_BASE_DIR:-/app/sandbox-labs}
      WORKER_AUTH_REQUIRED: "true"
      WORKER_TOKEN: ${WORKER_TOKEN}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
      CONNECTOR_AUTH_REQUIRED: "true"
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN}
      SCAN_JOB_TIMEOUT_MINUTES: ${SCAN_JOB_TIMEOUT_MINUTES:-20}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-minio}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-e2e}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cloudguard/evidence}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.cloudguard-e2e-web.entrypoints=web"
      - "traefik.http.routers.cloudguard-e2e-web.rule=Host(`cloudscanner.sc.deeptrustxai.com`)"
      - "traefik.http.routers.cloudguard-e2e-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.cloudguard-e2e-web.service=cloudguard-e2e-web"
      - "traefik.http.routers.cloudguard-e2e-websecure.entrypoints=websecure"
      - "traefik.http.routers.cloudguard-e2e-websecure.rule=Host(`cloudscanner.sc.deeptrustxai.com`)"
      - "traefik.http.routers.cloudguard-e2e-websecure.service=cloudguard-e2e-websecure"
      - "traefik.http.routers.cloudguard-e2e-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.cloudguard-e2e-web.loadbalancer.server.port=8000"
      - "traefik.http.services.cloudguard-e2e-websecure.loadbalancer.server.port=8000"

  scheduler-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: always
    command: ["python", "-m", "backend.scheduler_worker"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SCHEDULER_ENQUEUE_ONLY: "true"
      WORKER_TOKEN: ${WORKER_TOKEN}
      SCHEDULER_WORKER_ID: ${SCHEDULER_WORKER_ID:-e2e-scheduler-worker-1}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15}
      APP_ENV: scheduler
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:

networks:
  dokploy-network:
    external: true
