[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "backend/**",
  "config/**",
  "db/init/**",
  "deploy/**",
  "Dockerfile",
  "requirements.txt",
]

[deploy]
startCommand = "sh deploy/run-worker.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
