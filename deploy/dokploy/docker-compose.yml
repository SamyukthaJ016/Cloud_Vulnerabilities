services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scanner_db}
      POSTGRES_USER: ${POSTGRES_USER:-scanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner_user} -d ${POSTGRES_DB:-scanner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET};
      exit 0;
      "

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanner_db}
      QUEUE_BACKEND: postgres
      SCAN_JOB_INLINE_WORKER: "false"
      SANDBOX_LAB_INLINE_WORKER: "false"
      SANDBOX_LABS_ENABLED: ${SANDBOX_LABS_ENABLED:-true}
      SANDBOX_IAC_DEPLOY: ${SANDBOX_IAC_DEPLOY:-true}
      SANDBOX_AWS_DEPLOY: ${SANDBOX_AWS_DEPLOY:-false}
      SANDBOX_GCP_DEPLOY: ${SANDBOX_GCP_DEPLOY:-false}
      SANDBOX_KUBERNETES_DEPLOY: ${SANDBOX_KUBERNETES_DEPLOY:-false}
      SANDBOX_LAB_BASE_DIR: ${SANDBOX_LAB_BASE_DIR:-/app/sandbox-labs}
      WORKER_AUTH_REQUIRED: "true"
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
      CONNECTOR_AUTH_REQUIRED: "true"
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?CONNECTOR_TOKEN is required}
      SCAN_JOB_TIMEOUT_MINUTES: ${SCAN_JOB_TIMEOUT_MINUTES:-20}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-minio}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-dokploy}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cloudguard/evidence}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  scheduler-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: always
    command: ["python", "-m", "backend.scheduler_worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanner_db}
      SCHEDULER_ENQUEUE_ONLY: "true"
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required}
      SCHEDULER_WORKER_ID: ${SCHEDULER_WORKER_ID:-dokploy-scheduler-worker-1}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15}
      APP_ENV: scheduler
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  scan-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: always
    command: ["python", "backend/scripts/local_scan_job_worker.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanner_db}
      SCAN_WORKER_ID: ${SCAN_WORKER_ID:-dokploy-scan-worker-1}
      SCAN_WORKER_POLL_INTERVAL: ${SCAN_WORKER_POLL_INTERVAL:-10}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15}
      SCAN_JOB_TIMEOUT_MINUTES: ${SCAN_JOB_TIMEOUT_MINUTES:-20}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-minio}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-dokploy}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cloudguard/evidence}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      APP_ENV: worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    volumes:
      - scan_worker_reports:/app/reports
      - scan_worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  sandbox-lab-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: always
    command: ["python", "backend/scripts/sandbox_lab_worker.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanner_db}
      SANDBOX_LABS_ENABLED: ${SANDBOX_LABS_ENABLED:-true}
      SANDBOX_IAC_DEPLOY: ${SANDBOX_IAC_DEPLOY:-true}
      SANDBOX_AWS_DEPLOY: ${SANDBOX_AWS_DEPLOY:-false}
      SANDBOX_GCP_DEPLOY: ${SANDBOX_GCP_DEPLOY:-false}
      SANDBOX_KUBERNETES_DEPLOY: ${SANDBOX_KUBERNETES_DEPLOY:-false}
      SANDBOX_LAB_BASE_DIR: ${SANDBOX_LAB_BASE_DIR:-/app/sandbox-labs}
      SANDBOX_LAB_WORKER_ID: ${SANDBOX_LAB_WORKER_ID:-dokploy-sandbox-lab-worker-1}
      SANDBOX_LAB_WORKER_POLL_INTERVAL: ${SANDBOX_LAB_WORKER_POLL_INTERVAL:-10}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15}
      SCAN_JOB_TIMEOUT_MINUTES: ${SCAN_JOB_TIMEOUT_MINUTES:-20}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-minio}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-dokploy}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cloudguard/evidence}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      APP_ENV: sandbox-worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    volumes:
      - sandbox_lab_data:/app/sandbox-labs
      - scan_worker_reports:/app/reports
      - scan_worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  evidence-connector:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    restart: always
    command: ["python", "backend/scripts/evidence_connector.py"]
    environment:
      CLOUDGUARD_BASE_URL: http://backend:8000
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?CONNECTOR_TOKEN is required}
      CONNECTOR_USER_ID: ${CONNECTOR_USER_ID:-anonymous}
      EVIDENCE_CONNECTOR_ID: ${EVIDENCE_CONNECTOR_ID:-dokploy-evidence-connector-1}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15}
      EVIDENCE_CONNECTOR_INBOX: /app/connectors/inbox
      EVIDENCE_CONNECTOR_PROCESSED: /app/connectors/processed
      EVIDENCE_CONNECTOR_FAILED: /app/connectors/failed
      EVIDENCE_CONNECTOR_POLL_INTERVAL: ${EVIDENCE_CONNECTOR_POLL_INTERVAL:-10}
      EVIDENCE_SOURCE_SYSTEM: ${EVIDENCE_SOURCE_SYSTEM:-dokploy-file-connector}
      EVIDENCE_SCANNER_TYPE: ${EVIDENCE_SCANNER_TYPE:-external}
      EVIDENCE_ARTIFACT_TYPE: ${EVIDENCE_ARTIFACT_TYPE:-json}
      PYTHONPATH: /app
    volumes:
      - evidence_connector_data:/app/connectors
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  minio_data:
  scan_worker_reports:
  scan_worker_logs:
  sandbox_lab_data:
  evidence_connector_data:
