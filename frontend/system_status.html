<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudGuard - System Status</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #091413 0%, #285A48 100%);
            color: #B0E4CC;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: rgba(40, 90, 72, 0.82);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(176, 228, 204, 0.14);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .title h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #B0E4CC 0%, #408A71 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overall-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
        }

        .overall-status.healthy {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .overall-status.degraded {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .overall-status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.healthy { background: #10b981; }
        .status-indicator.degraded { background: #f59e0b; }
        .status-indicator.error { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .btn-secondary {
            background: rgba(176, 228, 204, 0.12);
            color: #B0E4CC;
            border: 1px solid rgba(176, 228, 204, 0.12);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(64, 138, 113, 0.3);
        }

        /* Overview Cards */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .overview-card {
            background: rgba(40, 90, 72, 0.74);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(176, 228, 204, 0.14);
        }

        .chart-container {
            height: 300px;
            position: relative;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: white;
        }

        /* Component Groups */
        .component-groups {
            display: grid;
            gap: 24px;
        }

        .component-group {
            background: rgba(40, 90, 72, 0.74);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(176, 228, 204, 0.14);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .group-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .group-status {
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .group-status.operational {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .group-status.partial {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        /* Component Cards */
        .components-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .component-card {
            background: rgba(9, 20, 19, 0.52);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .component-card:hover {
            transform: translateY(-2px);
            background: rgba(40, 90, 72, 0.82);
        }

        .component-card.online { border-left-color: #10b981; }
        .component-card.available { border-left-color: #10b981; }
        .component-card.operational { border-left-color: #10b981; }
        .component-card.offline { border-left-color: #ef4444; }
        .component-card.unavailable { border-left-color: #f59e0b; }
        .component-card.error { border-left-color: #ef4444; }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .component-name {
            font-weight: 600;
            color: white;
            font-size: 1.1rem;
        }

        .component-status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .component-status-badge.online,
        .component-status-badge.available,
        .component-status-badge.operational {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .component-status-badge.offline,
        .component-status-badge.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .component-status-badge.unavailable {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .component-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: #B0E4CC;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: #408A71;
        }

        .info-value {
            color: #B0E4CC;
            font-weight: 500;
        }

        /* Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .stat-card {
            background: rgba(9, 20, 19, 0.52);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin: 8px 0;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #B0E4CC;
            text-transform: uppercase;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #408A71;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(176, 228, 204, 0.22);
            border-top-color: #B0E4CC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Last Updated */
        .last-updated {
            text-align: center;
            color: #408A71;
            font-size: 0.9rem;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(176, 228, 204, 0.14);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .overview-grid {
                grid-template-columns: 1fr;
            }
            
            .components-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="title">
                <h1>🔍 System Status</h1>
                <div class="overall-status healthy" id="overallStatus">
                    <div class="status-indicator healthy"></div>
                    <span>All Systems Operational</span>
                </div>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" onclick="refreshStatus()">
                    🔄 Refresh Status
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">
                    📊 Dashboard
                </button>
            </div>
        </div>

        <!-- Overview Charts -->
        <div class="overview-grid">
            <div class="overview-card">
                <div class="chart-title">📊 Component Health</div>
                <div class="chart-container">
                    <canvas id="healthChart"></canvas>
                </div>
            </div>

            <div class="overview-card">
                <div class="chart-title">📈 System Statistics</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Scans Today</div>
                        <div class="stat-value" id="scansToday">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Active Schedules</div>
                        <div class="stat-value" id="activeSchedules">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Findings</div>
                        <div class="stat-value" id="totalFindings">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Avg Scan Time</div>
                        <div class="stat-value" id="avgScanTime">--</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Component Status -->
        <div class="component-groups" id="componentGroups">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading system status...</p>
            </div>
        </div>

        <!-- Last Updated -->
        <div class="last-updated" id="lastUpdated">
            Last updated: Loading...
        </div>
    </div>

    <script>
        let healthChart = null;
        let autoRefreshInterval = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSystemStatus();
            
            // Auto-refresh every 30 seconds
            autoRefreshInterval = setInterval(loadSystemStatus, 30000);
        });

        async function loadSystemStatus() {
            try {
                const response = await fetch('/api/system/status');
                const data = await response.json();

                updateOverallStatus(data.overall_status);
                updateStatistics(data.statistics);
                renderComponents(data.components);
                updateHealthChart(data.components);
                updateTimestamp(data.timestamp);

            } catch (error) {
                console.error('Failed to load system status:', error);
                showError();
            }
        }

        function updateOverallStatus(status) {
            const statusEl = document.getElementById('overallStatus');
            statusEl.className = `overall-status ${status}`;
            
            const indicator = statusEl.querySelector('.status-indicator');
            indicator.className = `status-indicator ${status}`;
            
            const messages = {
                'healthy': 'All Systems Operational',
                'partial': 'Partially Operational',
                'degraded': 'Degraded Performance',
                'error': 'System Issues Detected'
            };
            
            statusEl.querySelector('span').textContent = messages[status] || 'Unknown Status';
        }

        function updateStatistics(stats) {
            if (!stats) {
            stats = {
                total_scans_today: 0,
                active_schedules: 0,
                total_findings: 0,
                avg_scan_time: 0
            };
        }
            document.getElementById('scansToday').textContent = stats.total_scans_today || 0;
            document.getElementById('activeSchedules').textContent = stats.active_schedules || 0;
            document.getElementById('totalFindings').textContent = stats.total_findings || 0;
            document.getElementById('avgScanTime').textContent = 
                stats.avg_scan_time ? `${Math.round(stats.avg_scan_time)}s` : '--';
        }

        function renderComponents(components) {
            const container = document.getElementById('componentGroups');

            const groups = [
                {
                    key: 'mcp_servers',
                    title: '🖥️ MCP Servers',
                    description: 'Cloud provider integration servers'
                },
                {
                    key: 'vulnerability_scanners',
                    title: '🔍 Vulnerability Scanners',
                    description: 'Security scanning tools'
                },
                {
                    key: 'database',
                    title: '💾 Database',
                    description: 'PostgreSQL database connection'
                },
                {
                    key: 'api_endpoints',
                    title: '🌐 API Endpoints',
                    description: 'REST API availability'
                }
            ];

            container.innerHTML = groups.map(group => {
                const componentsList = Array.isArray(components[group.key])
                    ? components[group.key]
                    : [];

                const allOperational = componentsList.length > 0 &&
                    componentsList.every(comp =>
                        ['online', 'available', 'operational'].includes(comp.status)
                    );

                const groupStatus = allOperational ? 'operational' : 'partial';

                return `
                    <div class="component-group">
                    <div class="group-header">
                            <div>
                                <div class="group-title">
                                    ${group.title}
                                    <span style="color: #408A71; font-size: 0.9rem; font-weight: 400;">
                                        ${group.description}
                                    </span>
                                </div>
                            </div>
                            <div class="group-status ${groupStatus}">
                                ${componentsList.length} ${componentsList.length === 1 ? 'Component' : 'Components'}
                            </div>
                        </div>

                        <div class="components-grid">
                            ${componentsList.length === 0 ? `
                                <div style="color:#408A71;font-size:0.9rem">
                                    No components available
                                </div>
                            ` : componentsList.map(comp => `
                                <div class="component-card ${comp.status}">
                                    <div class="component-header">
                                        <div class="component-name">
                                            ${formatComponentName(comp.name)}
                                        </div>
                                        <div class="component-status-badge ${comp.status}">
                                            ${comp.status}
                                        </div>
                                    </div>

                                    <div class="component-info">
                                        ${comp.tools_count !== undefined ? `
                                            <div class="info-row">
                                                <span class="info-label">Tools:</span>
                                                <span class="info-value">${comp.tools_count}</span>
                                            </div>
                                        ` : ''}

                                        ${comp.latency_ms ? `
                                            <div class="info-row">
                                                <span class="info-label">Latency:</span>
                                                <span class="info-value">${comp.latency_ms}</span>
                                            </div>
                                        ` : ''}

                                        ${comp.response_time_ms !== undefined ? `
                                            <div class="info-row">
                                                <span class="info-label">Response Time:</span>
                                                <span class="info-value">${comp.response_time_ms}ms</span>
                                            </div>
                                        ` : ''}

                                        ${comp.error ? `
                                            <div class="info-row" style="color:#fca5a5;">
                                                <span class="info-label">Error:</span>
                                                <span class="info-value">${comp.error}</span>
                                            </div>
                                        ` : ''}

                                        <div class="info-row">
                                            <span class="info-label">Last Check:</span>
                                            <span class="info-value">${formatTime(comp.last_check)}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }


        function updateHealthChart(components) {
            const ctx = document.getElementById('healthChart');
            
            if (healthChart) {
                healthChart.destroy();
            }

            // Count statuses
            let online = 0, offline = 0, partial = 0;
            
            Object.values(components).forEach(group => {
                Object.values(group).forEach(comp => {
                    if (['online', 'available', 'operational'].includes(comp.status)) {
                        online++;
                    } else if (['offline', 'error'].includes(comp.status)) {
                        offline++;
                    } else {
                        partial++;
                    }
                });
            });

            healthChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Operational', 'Offline', 'Partial'],
                    datasets: [{
                        data: [online, offline, partial],
                        backgroundColor: [
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(245, 158, 11, 0.8)'
                        ],
                        borderColor: [
                            'rgba(34, 197, 94, 1)',
                            'rgba(239, 68, 68, 1)',
                            'rgba(245, 158, 11, 1)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#B0E4CC',
                                padding: 20,
                                font: { size: 12 }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(9, 20, 19, 0.9)',
                            titleColor: '#B0E4CC',
                            bodyColor: '#B0E4CC',
                            borderColor: '#408A71',
                            borderWidth: 1,
                            padding: 12
                        }
                    }
                }
            });
        }

        function updateTimestamp(timestamp) {
            const date = new Date(timestamp);
            const formatted = date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            
            document.getElementById('lastUpdated').textContent = `Last updated: ${formatted}`;
        }

        function formatComponentName(name) {
            return name
                .replace(/_/g, ' ')
                .replace(/\//g, ' / ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        function refreshStatus() {
            loadSystemStatus();
            
            // Show feedback
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Refreshing...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 1000);
        }

        function showError() {
            document.getElementById('componentGroups').innerHTML = `
                <div style="text-align: center; padding: 60px; color: #fca5a5;">
                    <h2>⚠️ Failed to Load System Status</h2>
                    <p>Please try refreshing the page</p>
                    <button class="btn btn-secondary" onclick="loadSystemStatus()" style="margin-top: 20px;">
                        🔄 Retry
                    </button>
                </div>
            `;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
