<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History - CloudGuard Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .filters {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 14px;
        }

        .scans-table {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(51, 65, 85, 0.8);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-top: 1px solid rgba(51, 65, 85, 0.5);
        }

        tbody tr {
            transition: background 0.2s;
            cursor: pointer;
        }

        tbody tr:hover {
            background: rgba(51, 65, 85, 0.4);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .status-running {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .severity-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }

        .severity-critical {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .severity-high {
            background: rgba(249, 115, 22, 0.2);
            color: #fb923c;
        }

        .severity-medium {
            background: rgba(234, 179, 8, 0.2);
            color: #fbbf24;
        }

        .severity-low {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background: #334155;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            color: #94a3b8;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .cloud-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📊 Scan History</h1>
            <button class="btn btn-secondary" onclick="goToDashboard()">
                📊 View Dashboard
            </button>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Cloud Provider</label>
                <select id="providerFilter">
                    <option value="">All Providers</option>
                    <option value="aws">AWS</option>
                    <option value="gcp">GCP</option>
                    <option value="azure">Azure</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Status</label>
                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="running">Running</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <div class="filter-group">
                <label>From Date</label>
                <input type="date" id="fromDate">
            </div>

            <div class="filter-group">
                <label>To Date</label>
                <input type="date" id="toDate">
            </div>

            <button class="btn btn-primary" onclick="applyFilters()" style="margin-top: 20px;">Apply Filters</button>
        </div>

        <div class="scans-table">
            <table>
                <thead>
                    <tr>
                        <th>Scan ID</th>
                        <th>Cloud Provider</th>
                        <th>Account ID</th>
                        <th>Status</th>
                        <th>Started At</th>
                        <th>Duration</th>
                        <th>Resources</th>
                        <th>Findings</th>
                        <th>Critical</th>
                    </tr>
                </thead>
                <tbody id="scansTableBody">
                    <tr>
                        <td colspan="9" class="loading">Loading scan history...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button id="prevBtn" onclick="previousPage()" disabled>← Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextBtn" onclick="nextPage()">Next →</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 20;
        let totalScans = 0;
        let filters = {
            provider: '',
            status: '',
            fromDate: '',
            toDate: ''
        };

        function getUserId() {
            let userId = localStorage.getItem('cloudguard_user_id');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('cloudguard_user_id', userId);
            }
            return userId;
        }

        async function loadScans() {
            try {
                const userId = getUserId();
                const offset = (currentPage - 1) * pageSize;

                let url = `/api/scans?user_id=${userId}&limit=${pageSize}&offset=${offset}`;

                if (filters.provider) url += `&provider=${filters.provider}`;
                if (filters.status) url += `&status=${filters.status}`;
                if (filters.fromDate) url += `&from_date=${filters.fromDate}`;
                if (filters.toDate) url += `&to_date=${filters.toDate}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success') {
                    displayScans(data.scans);
                    totalScans = data.total || data.scans.length;
                    updatePagination();
                } else {
                    showError('Failed to load scans');
                }
            } catch (error) {
                console.error('Error loading scans:', error);
                showError('Error loading scans');
            }
        }

        function displayScans(scans) {
            const tbody = document.getElementById('scansTableBody');

            if (!scans || scans.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <h3>No scans found</h3>
                            <p>Try adjusting your filters or run a new scan</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = scans.map(scan => `
                <tr onclick="viewScanDetails(${scan.id})">
                    <td>#${scan.id}</td>
                    <td><span class="cloud-badge">${scan.cloud.toUpperCase()}</span></td>
                    <td>${scan.account_id || 'N/A'}</td>
                    <td><span class="status-badge status-${scan.status}">${scan.status}</span></td>
                    <td>${new Date(scan.started_at).toLocaleString()}</td>
                    <td>${scan.duration_seconds ? scan.duration_seconds + 's' : '-'}</td>
                    <td>${scan.resource_count || 0}</td>
                    <td>${scan.finding_count || 0}</td>
                    <td>${scan.critical_count ? `<span class="severity-badge severity-critical">${scan.critical_count}</span>` : '-'}</td>
                </tr>
            `).join('');
        }

        function showError(message) {
            const tbody = document.getElementById('scansTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="empty-state">
                        <h3>⚠️ ${message}</h3>
                    </td>
                </tr>
            `;
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalScans / pageSize);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadScans();
            }
        }

        function nextPage() {
            currentPage++;
            loadScans();
        }

        function applyFilters() {
            filters.provider = document.getElementById('providerFilter').value;
            filters.status = document.getElementById('statusFilter').value;
            filters.fromDate = document.getElementById('fromDate').value;
            filters.toDate = document.getElementById('toDate').value;
            currentPage = 1;
            loadScans();
        }

        function viewScanDetails(scanId) {
            window.location.href = `/dashboard?scan_id=${scanId}`;
        }
        function goToDashboard() {
            window.location.href = '/dashboard';
        }
        // Load scans on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadScans();
        });
    </script>
</body>

</html>
