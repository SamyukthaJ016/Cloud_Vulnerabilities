<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 520px;
      background: #131629;
      border-radius: 16px;
      border: 1px solid #1e2240;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    .shell-header {
      padding: 24px 28px;
      border-bottom: 1px solid #1e2240;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #4a5568;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .back-btn:hover { color: #94a3b8; }

    .shell-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .shell-body { padding: 28px; }

    /* Order summary */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 14px;
    }

    .plan-rows { display: flex; flex-direction: column; gap: 10px; }

    .plan-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f1120;
      border: 1px solid #1e2240;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .plan-row-left { display: flex; flex-direction: column; gap: 3px; }

    .plan-row-name {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .plan-row-cycle {
      font-size: 12px;
      color: #4a5568;
      text-transform: capitalize;
    }

    .plan-row-price {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .divider {
      height: 1px;
      background: #1e2240;
      margin: 20px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .total-label {
      font-size: 14px;
      color: #94a3b8;
    }

    .total-amount {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .total-note {
      font-size: 12px;
      color: #4a5568;
      text-align: right;
      margin-top: 2px;
    }

    /* Pay button */
    .pay-btn {
      width: 100%;
      padding: 15px;
      background: #4f63f0;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pay-btn:hover:not(:disabled) { background: #3b4fd8; }
    .pay-btn:disabled {
      background: #1e2240;
      color: #4a5568;
      cursor: not-allowed;
    }

    .pay-btn .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .pay-btn.loading .spinner { display: block; }
    .pay-btn.loading .btn-text { display: none; }

    /* Status states */
    .status-box {
      display: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 16px;
      line-height: 1.5;
    }

    .status-box.success {
      background: #0f2a1a;
      border: 1px solid #1a5c35;
      color: #4ade80;
    }

    .status-box.error {
      background: #2a0f0f;
      border: 1px solid #5c1a1a;
      color: #f87171;
    }

    .status-box.visible { display: block; }

    .skeleton-notice {
      background: #1a1506;
      border: 1px solid #4a3800;
      color: #fbbf24;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
    }

    .loading-state, .error-state {
      padding: 40px;
      text-align: center;
      color: #4a5568;
      font-size: 14px;
    }

    .error-state { color: #f87171; }
  </style>
</head>
<body>

<div class="shell">
  <div class="shell-header">
    <button class="back-btn" onclick="history.back()">
      <svg width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="shell-title">Order Summary</div>
  </div>

  <div class="shell-body" id="shellBody">
    <div class="loading-state">Loading your order...</div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:8080';

  // ── Read plan_ids from URL ─────────────────────────────────
  // Handles all three formats:
  //   ?plan_id=abc&plan_id=xyz   (multi, from new plans page)
  //   ?plan_ids=abc,xyz          (comma-separated, legacy)
  //   ?plan_id=abc               (single, legacy)
  function getPlanIDs() {
    const params = new URLSearchParams(window.location.search);

    // Format 1: multiple ?plan_id= params (what the new plans page sends)
    const multi = params.getAll('plan_id');
    if (multi.length > 0) return multi.filter(Boolean);

    // Format 2: single comma-separated ?plan_ids=
    const combined = params.get('plan_ids');
    if (combined) return combined.split(',').filter(Boolean);

    return [];
  }

  async function init() {
    const planIDs = getPlanIDs();
    const body    = document.getElementById('shellBody');

    if (planIDs.length === 0) {
      body.innerHTML = `<div class="error-state">
        No plans selected. <a href="../plans/index.html"
        style="color:#4f63f0">Go back</a></div>`;
      return;
    }

    // Fetch all plans once, filter to selected
    let allPlans = [];
    try {
      const res = await fetch(`${API_BASE}/plans`);
      if (!res.ok) throw new Error();
      allPlans = await res.json();
    } catch {
      body.innerHTML = `<div class="error-state">Could not reach server</div>`;
      return;
    }

    const selected = planIDs
      .map(id => allPlans.find(p => p.id === id))
      .filter(Boolean);

    if (selected.length === 0) {
      body.innerHTML = `<div class="error-state">Plans not found</div>`;
      return;
    }

    renderCheckout(selected);
  }

  function formatINR(paise) {
    return (paise / 100).toLocaleString('en-IN');
  }

  function renderCheckout(plans) {
    const body        = document.getElementById('shellBody');
    const totalPaise  = plans.reduce((s, p) => s + p.amount_paise, 0);
    const isSkeletonMode = plans.some(p => p.amount_paise === 0);

    const planRowsHTML = plans.map(p => `
      <div class="plan-row">
        <div class="plan-row-left">
          <div class="plan-row-name">${p.product_name}</div>
          <div class="plan-row-cycle">${p.billing_cycle}</div>
        </div>
        <div class="plan-row-price">₹${formatINR(p.amount_paise)}</div>
      </div>
    `).join('');

    body.innerHTML = `
      ${isSkeletonMode ? `
        <div class="skeleton-notice" style="display:block">
          ⚠ Razorpay keys not configured — payment will not process yet
        </div>` : ''}

      <div class="section-label">Your Order</div>
      <div class="plan-rows">${planRowsHTML}</div>

      <div class="divider"></div>

      <div class="total-row">
        <div class="total-label">Total due today</div>
        <div>
          <div class="total-amount">₹${formatINR(totalPaise)}</div>
          <div class="total-note">per cycle · INR</div>
        </div>
      </div>

      <button class="pay-btn" id="payBtn" onclick="handlePay()">
        <div class="spinner"></div>
        <span class="btn-text">Pay ₹${formatINR(totalPaise)}</span>
      </button>

      <div class="status-box" id="statusBox"></div>
    `;

    // store for handlePay
    window._selectedPlans = plans;
  }

  // ── Payment trigger ────────────────────────────────────────
  // POST /subscribe once per plan, sequentially
  // Razorpay modal hookup goes here in Phase 6
  async function handlePay() {
    const btn    = document.getElementById('payBtn');
    const status = document.getElementById('statusBox');
    const plans  = window._selectedPlans;

    btn.disabled = true;
    btn.classList.add('loading');
    status.className = 'status-box';
    status.textContent = '';

    try {
      // Phase 6: replace this block with real Razorpay modal per plan
      // For now: call POST /subscribe for each plan as a skeleton test
      const results = [];
      for (const plan of plans) {
        const res = await fetch(`${API_BASE}/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan_id: plan.id })
        });
        results.push({ plan: plan.product_name, status: res.status });
      }

      const allOk = results.every(r => r.status === 200 || r.status === 503);
      status.className = 'status-box visible ' +
        (allOk ? 'success' : 'error');
      status.textContent = allOk
        ? 'Subscriptions initiated. Awaiting payment confirmation.'
        : 'One or more plans failed. Please retry.';

    } catch {
      status.className = 'status-box visible error';
      status.textContent = 'Network error. Please check your connection.';
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  init();
</script>
</body>
</html>
