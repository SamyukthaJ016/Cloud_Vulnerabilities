<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep:    #080a14;
      --bg-shell:   #0d1021;
      --bg-sidebar: #090b18;
      --bg-card:    #0d1021;
      --border:     #1a1f3a;
      --border-hi:  #2d3a80;
      --accent:     #5b72f5;
      --accent-hi:  #7b8ff7;
      --accent-dim: #1e2560;
      --text-hi:    #eef0ff;
      --text-mid:   #8892b0;
      --text-lo:    #3a4266;
      --green:      #36e8a0;
      --green-bg:   #0a2a1e;
      --green-border:#1a5c3a;
      --multi-accent:#f5a623;
      --multi-bg:   #2a1a06;
      --multi-border:#6b4710;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-hi);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(91,114,245,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 80%, rgba(54,232,160,0.04) 0%, transparent 70%);
    }

    .shell {
      display: flex;
      width: 940px;
      height: 600px;
      background: var(--bg-shell);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(91,114,245,0.05);
      animation: shellIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes shellIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 268px;
      min-width: 268px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 28px 14px;
    }

    .sidebar-header {
      padding: 0 10px 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .sidebar-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-lo);
    }

    .sidebar-subtitle {
      font-size: 12px;
      color: var(--text-mid);
      margin-top: 4px;
    }

    .product-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .product-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-mid);
      position: relative;
      user-select: none;
    }

    .product-item:hover {
      background: rgba(91,114,245,0.07);
      color: var(--text-hi);
      border-color: rgba(91,114,245,0.12);
    }

    .product-item.active {
      background: rgba(91,114,245,0.12);
      border-color: rgba(91,114,245,0.35);
      color: #fff;
    }

    .product-item .check {
      width: 17px;
      height: 17px;
      border-radius: 5px;
      border: 1.5px solid var(--text-lo);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
      background: transparent;
    }

    .product-item.active .check {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .check svg { display: none; }
    .product-item.active .check svg { display: block; }

    /* Multi-select count badge on sidebar */
    .multi-badge {
      display: none;
      margin-left: auto;
      background: var(--multi-accent);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      padding: 2px 7px;
      border-radius: 99px;
    }

    .multi-badge.visible { display: flex; }

    /* ── Multi-select banner ── */
    .multi-hint {
      margin: 0 0 14px;
      background: var(--multi-bg);
      border: 1px solid var(--multi-border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: var(--multi-accent);
      display: flex;
      align-items: center;
      gap: 7px;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .multi-hint.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .sidebar-footer {
      padding: 12px 6px 0;
      border-top: 1px solid var(--border);
      margin-top: 12px;
    }

    .settings-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-lo);
      cursor: pointer;
      padding: 8px 6px;
      border-radius: 8px;
      transition: color 0.15s;
    }
    .settings-link:hover { color: var(--text-mid); }
    .settings-left { display: flex; align-items: center; gap: 8px; }

    /* ── Main Panel ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 30px;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .top-bar-left {
      display: flex;
      flex-direction: column;
    }

    .page-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-lo);
      font-weight: 600;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-hi);
      margin-top: 3px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-group {
      display: flex;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .toggle-btn {
      padding: 6px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
      background: transparent;
      color: var(--text-mid);
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(91,114,245,0.35);
    }

    .save-badge {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green);
      font-size: 11.5px;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      padding: 5px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.02em;
    }

    /* ── Plan Card ── */
    .plan-card {
      flex: 1;
      border: 1.5px solid var(--border-hi);
      border-radius: 16px;
      padding: 28px 30px;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
      background-image: radial-gradient(ellipse 70% 50% at 100% 0%, rgba(91,114,245,0.06) 0%, transparent 60%);
      transition: border-color 0.2s;
    }

    /* Multi-select card style */
    .plan-card.multi-mode {
      border-color: var(--multi-border);
      background-image: radial-gradient(ellipse 70% 50% at 100% 0%, rgba(245,166,35,0.05) 0%, transparent 60%);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-dim);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(91,114,245,0.2);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-mid);
      margin-top: 2px;
    }

    .selected-count-chip {
      background: var(--multi-bg);
      border: 1px solid var(--multi-border);
      color: var(--multi-accent);
      font-size: 11px;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .selected-count-chip.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Multi-plan summary list ── */
    .multi-plan-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .multi-plan-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      animation: rowIn 0.2s ease both;
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .multi-plan-row .plan-row-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-hi);
    }

    .multi-plan-row .plan-row-cycle {
      font-size: 11px;
      color: var(--text-mid);
      margin-top: 2px;
    }

    .multi-plan-row .plan-row-price {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-hi);
    }

    .multi-plan-row .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-lo);
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      margin-left: 10px;
    }
    .multi-plan-row .remove-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }

    .multi-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    .multi-total-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mid);
    }

    .multi-total-amount {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      color: #fff;
    }

    /* ── Single plan view ── */
    .price-row { margin-bottom: 6px; }

    .price-amount {
      font-family: 'DM Mono', monospace;
      font-size: 40px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1;
    }

    .price-amount span {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--text-mid);
      margin-left: 2px;
    }

    .price-note {
      font-size: 12.5px;
      color: var(--text-lo);
      margin-top: 5px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
    }

    .features-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-lo);
      margin-bottom: 12px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      color: var(--text-mid);
    }

    .feature-dot {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1.5px solid rgba(91,114,245,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(91,114,245,0.08);
    }

    .empty-features {
      font-size: 13px;
      color: var(--text-lo);
      font-style: italic;
    }

    /* ── Subscribe button ── */
    .subscribe-btn {
      margin-top: auto;
      padding: 13px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 20px rgba(91,114,245,0.3);
    }

    .subscribe-btn:hover {
      background: var(--accent-hi);
      box-shadow: 0 6px 28px rgba(91,114,245,0.45);
      transform: translateY(-1px);
    }

    .subscribe-btn:active { transform: translateY(0); }

    .subscribe-btn.multi {
      background: linear-gradient(135deg, #e69420 0%, #f5a623 100%);
      box-shadow: 0 4px 20px rgba(245,166,35,0.3);
    }
    .subscribe-btn.multi:hover {
      box-shadow: 0 6px 28px rgba(245,166,35,0.45);
    }

    .loading, .error-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-lo);
      font-size: 14px;
    }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>

<div class="shell">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Products</div>
      <div class="sidebar-subtitle">Select one or more plans</div>
    </div>

    <!-- Multi-hint banner -->
    <div class="multi-hint" id="multiHint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span id="multiHintText">2 plans selected</span>
    </div>

    <div class="product-list" id="productList">
      <div class="loading">Loading...</div>
    </div>

    <div class="sidebar-footer">
      <div class="settings-link">
        <div class="settings-left">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </div>
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Main Panel -->
  <div class="main">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="page-label">Subscription</div>
        <div class="page-title">Choose a Plan</div>
      </div>
      <div class="top-bar-right">
        <div class="toggle-group">
          <button class="toggle-btn active" id="btnMonthly" onclick="setBilling('monthly')">Monthly</button>
          <button class="toggle-btn" id="btnYearly" onclick="setBilling('yearly')">Yearly</button>
        </div>
        <div class="save-badge">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Save 20%
        </div>
      </div>
    </div>

    <div class="plan-card" id="planCard">
      <div class="loading">Loading plans…</div>
    </div>
  </div>

</div>

<script>
  const API_BASE = 'http://127.0.0.1:8080';

  let allPlans        = [];
  let selectedProducts = new Set();   // ← multi-select set
  let billingCycle    = 'monthly';

  // ── Bootstrap ──────────────────────────────────────────────
  async function init() {
    try {
      const res = await fetch(`${API_BASE}/plans`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allPlans = await res.json();
      buildSidebar();
      const first = getUniqueProducts()[0];
      if (first) selectProduct(first);
    } catch (e) {
      document.getElementById('productList').innerHTML =
        `<div class="error-msg">Failed to load plans</div>`;
      document.getElementById('planCard').innerHTML =
        `<div class="error-msg">Could not reach server</div>`;
    }
  }

  // ── Helpers ────────────────────────────────────────────────
  function getUniqueProducts() {
    const seen = new Set();
    const out  = [];
    for (const p of allPlans) {
      if (!seen.has(p.product_id)) {
        seen.add(p.product_id);
        out.push(p.product_id);
      }
    }
    return out.sort((a, b) => a === 'master' ? 1 : b === 'master' ? -1 : 0);
  }

  function getProductName(productID) {
    const p = allPlans.find(x => x.product_id === productID);
    return p ? p.product_name : productID;
  }

  function getPlanFor(productID) {
    return allPlans.find(
      p => p.product_id === productID && p.billing_cycle === billingCycle
    );
  }

  function formatINR(paise) {
    return (paise / 100).toLocaleString('en-IN');
  }

  // ── Sidebar ────────────────────────────────────────────────
  function buildSidebar() {
    const products = getUniqueProducts();
    const list     = document.getElementById('productList');

    list.innerHTML = products.map(pid => {
      const name = getProductName(pid);
      return `
        <div class="product-item" id="item-${pid}" onclick="selectProduct('${pid}')">
          <div class="check">
            <svg width="9" height="9" viewBox="0 0 12 12" fill="none"
                 stroke="#fff" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2 6 5 9 10 3"/>
            </svg>
          </div>
          <span>${name}</span>
          <span class="multi-badge" id="badge-${pid}"></span>
        </div>`;
    }).join('');
  }

  // Toggle product selection (multi-select)
  function selectProduct(productID) {
    if (selectedProducts.has(productID)) {
      // Deselect only if more than one selected
      if (selectedProducts.size > 1) {
        selectedProducts.delete(productID);
      }
      // If only one left, keep it selected (can't have 0)
    } else {
      selectedProducts.add(productID);
    }
    refreshSidebarActive();
    renderCard();
  }

  function refreshSidebarActive() {
    document.querySelectorAll('.product-item').forEach(el => {
      const pid = el.id.replace('item-', '');
      el.classList.toggle('active', selectedProducts.has(pid));
    });
    updateMultiHint();
  }

  function updateMultiHint() {
    const count = selectedProducts.size;
    const hint  = document.getElementById('multiHint');
    const txt   = document.getElementById('multiHintText');
    if (count > 1) {
      txt.textContent = `${count} plans selected — bundle checkout`;
      hint.classList.add('visible');
    } else {
      hint.classList.remove('visible');
    }
  }

  // ── Billing toggle ─────────────────────────────────────────
  function setBilling(cycle) {
    billingCycle = cycle;
    document.getElementById('btnMonthly').classList.toggle('active', cycle === 'monthly');
    document.getElementById('btnYearly').classList.toggle('active', cycle === 'yearly');
    renderCard();
  }

  // ── Card ───────────────────────────────────────────────────
  function renderCard() {
    const card       = document.getElementById('planCard');
    const isMulti    = selectedProducts.size > 1;
    const cycleLabel = billingCycle === 'monthly' ? '/mo' : '/yr';
    const noteText   = billingCycle === 'monthly'
      ? 'Cancel anytime · No commitment'
      : 'Billed annually · Best value';

    card.classList.toggle('multi-mode', isMulti);

    if (isMulti) {
      renderMultiCard(card, cycleLabel);
    } else {
      const [productID] = [...selectedProducts];
      renderSingleCard(card, productID, cycleLabel, noteText);
    }
  }

  function renderSingleCard(card, productID, cycleLabel, noteText) {
    const plan = getPlanFor(productID);

    if (!plan) {
      card.innerHTML = `<div class="error-msg">Plan not found for this billing cycle</div>`;
      return;
    }

    const featuresHTML = plan.features && plan.features.length > 0
      ? plan.features.map(f => `
          <div class="feature-item">
            <div class="feature-dot">
              <svg width="9" height="9" viewBox="0 0 12 12" fill="none"
                   stroke="#4f63f0" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <polyline points="2 6 5 9 10 3"/>
              </svg>
            </div>
            ${f}
          </div>`).join('')
      : `<div class="empty-features">Features coming soon</div>`;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-icon">
            <svg width="13" height="13" viewBox="0 0 12 12" fill="none"
                 stroke="#5b72f5" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2 6 5 9 10 3"/>
            </svg>
          </div>
          <div>
            <div class="card-title">${plan.product_name}</div>
            <div class="card-subtitle">${noteText}</div>
          </div>
        </div>
        <div class="selected-count-chip" id="countChip"></div>
      </div>

      <div class="price-row">
        <div class="price-amount">₹${formatINR(plan.amount_paise)}<span>${cycleLabel}</span></div>
      </div>

      <div class="divider"></div>

      <div class="features-label">Included in this plan</div>
      <div class="feature-list">${featuresHTML}</div>

      <button class="subscribe-btn" onclick="goToCheckout()">
        Subscribe to ${plan.product_name}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    `;
  }

  function renderMultiCard(card, cycleLabel) {
    const plans = [...selectedProducts]
      .map(pid => getPlanFor(pid))
      .filter(Boolean);

    if (plans.length === 0) {
      card.innerHTML = `<div class="error-msg">No plans found for this billing cycle</div>`;
      return;
    }

    const totalPaise = plans.reduce((sum, p) => sum + p.amount_paise, 0);

    const rowsHTML = plans.map(p => `
      <div class="multi-plan-row">
        <div>
          <div class="plan-row-name">${p.product_name}</div>
          <div class="plan-row-cycle">${p.billing_cycle === 'monthly' ? 'Monthly' : 'Annual'} billing</div>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="plan-row-price">₹${formatINR(p.amount_paise)}${cycleLabel}</div>
          <button class="remove-btn" onclick="removeProduct('${p.product_id}')" title="Remove">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>`).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-icon" style="background:var(--multi-bg);box-shadow:0 0 0 1px rgba(245,166,35,0.25);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="#f5a623" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <div>
            <div class="card-title">Bundle Checkout</div>
            <div class="card-subtitle">${plans.length} plans · ${billingCycle} billing</div>
          </div>
        </div>
        <div class="selected-count-chip visible" style="background:var(--multi-bg);border-color:var(--multi-border);color:var(--multi-accent);">
          ${plans.length} selected
        </div>
      </div>

      <div class="divider"></div>

      <div class="features-label">Selected Plans</div>
      <div class="multi-plan-list">${rowsHTML}</div>

      <div class="multi-total-row">
        <div class="multi-total-label">Total ${billingCycle === 'monthly' ? 'per month' : 'per year'}</div>
        <div class="multi-total-amount">₹${formatINR(totalPaise)}</div>
      </div>

      <div style="margin-top:12px;">
        <button class="subscribe-btn multi" onclick="goToCheckout()">
          Checkout ${plans.length} Plans — ₹${formatINR(totalPaise)}${cycleLabel}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    `;
  }

  // Remove a product from multi-select
  function removeProduct(productID) {
    if (selectedProducts.size <= 1) return;
    selectedProducts.delete(productID);
    refreshSidebarActive();
    renderCard();
  }

  // ── Checkout handoff ───────────────────────────────────────
  // Passes all selected plan IDs as comma-separated plan_id param
  // (or multiple plan_id params) — checkout page can read either way
  function goToCheckout() {
    const planIDs = [...selectedProducts]
      .map(pid => {
        const plan = getPlanFor(pid);
        return plan ? plan.id : null;
      })
      .filter(Boolean);

    if (planIDs.length === 0) return;

    if (planIDs.length === 1) {
      // Single plan — same URL as before, no breakage
      window.location.href = `../checkout/index.html?plan_id=${planIDs[0]}`;
    } else {
      // Multiple plans — append each as plan_id param
      const params = planIDs.map(id => `plan_id=${encodeURIComponent(id)}`).join('&');
      window.location.href = `../checkout/index.html?${params}`;
    }
  }

  init();
</script>
</body>
</html>
