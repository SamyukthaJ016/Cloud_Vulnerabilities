AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to create a read-only IAM role for CloudGuard security scanner with comprehensive permissions for full security scanning'

Parameters:
  ScannerAccountId:
    Type: String
    Description: 'AWS Account ID of the CloudGuard Master Scanner (leave as default unless using a different scanner)'
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: 'Must be a 12-digit AWS Account ID.'
    Default: '859561299880'

Resources:
  # IAM Role for CloudGuard Scanner
  CloudGuardReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      # RoleName removed - CloudFormation will auto-generate unique name
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${ScannerAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: 'CloudGuard-Scanner-Validation'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
      Policies:
        - PolicyName: CloudGuardEnhancedReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # IAM - Identity and Access Management
                  - 'iam:List*'
                  - 'iam:Get*'
                  - 'iam:GenerateCredentialReport'
                  - 'iam:GetCredentialReport'
                  
                  # S3 - Storage
                  - 's3:ListAllMyBuckets'
                  - 's3:Get*'
                  - 's3:ListBucket'
                  
                  # EC2 - Compute and Networking
                  - 'ec2:Describe*'
                  
                  # CloudTrail - Logging
                  - 'cloudtrail:DescribeTrails'
                  - 'cloudtrail:GetTrailStatus'
                  - 'cloudtrail:LookupEvents'
                  - 'cloudtrail:GetEventSelectors'
                  
                  # GuardDuty - Threat Detection
                  - 'guardduty:List*'
                  - 'guardduty:Get*'
                  - 'guardduty:Describe*'
                  
                  # Config - Configuration Management
                  - 'config:Describe*'
                  - 'config:Get*'
                  - 'config:List*'
                  
                  # KMS - Key Management
                  - 'kms:ListKeys'
                  - 'kms:DescribeKey'
                  - 'kms:GetKeyRotationStatus'
                  - 'kms:GetKeyPolicy'
                  - 'kms:ListAliases'
                  
                  # CloudWatch - Monitoring
                  - 'logs:Describe*'
                  - 'cloudwatch:Describe*'
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:ListMetrics'
                  
                  # Secrets Manager - Secrets
                  - 'secretsmanager:ListSecrets'
                  - 'secretsmanager:DescribeSecret'
                  - 'secretsmanager:GetResourcePolicy'
                  
                  # Systems Manager - Parameter Store
                  - 'ssm:DescribeParameters'
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  
                  # Lambda - Serverless
                  - 'lambda:List*'
                  - 'lambda:Get*'
                  
                  # RDS - Databases
                  - 'rds:Describe*'
                  - 'rds:ListTagsForResource'
                  
                  # ECS/EKS - Container Services
                  - 'ecs:Describe*'
                  - 'ecs:List*'
                  - 'eks:Describe*'
                  - 'eks:List*'
                  
                  # ELB - Load Balancers
                  - 'elasticloadbalancing:Describe*'
                  
                  # VPC - Networking
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeNetworkAcls'
                  - 'ec2:DescribeRouteTables'
                  - 'ec2:DescribeFlowLogs'
                  
                  # SNS - Notifications
                  - 'sns:List*'
                  - 'sns:Get*'
                  
                  # SQS - Queues
                  - 'sqs:List*'
                  - 'sqs:Get*'
                  
                  # DynamoDB - NoSQL Database
                  - 'dynamodb:List*'
                  - 'dynamodb:Describe*'
                  
                  # Backup - Backup Services
                  - 'backup:List*'
                  - 'backup:Describe*'
                  - 'backup:Get*'
                  
                  # Inspector - Vulnerability Assessment
                  - 'inspector2:List*'
                  - 'inspector2:Get*'
                  - 'inspector2:Describe*'
                  
                  # Access Analyzer
                  - 'access-analyzer:List*'
                  - 'access-analyzer:Get*'
                  
                  # Organizations
                  - 'organizations:Describe*'
                  - 'organizations:List*'
                  
                  # STS - Security Token Service
                  - 'sts:GetCallerIdentity'
                  
                Resource: '*'
      Description: "Read-only role assumed by the CloudGuard scanner to perform comprehensive security assessments."

  # IAM Managed Policy for Scanner Identity
  CloudGuardScannerIdentityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "CloudGuard-Scanner-Policy-${AWS::StackName}"
      Description: 'Managed policy for the IAM User running the scanner to allow it to assume the read-only role.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt CloudGuardReadOnlyRole.Arn

Outputs:
  RoleArn:
    Description: The ARN of the role created for the scanner.
    Value: !GetAtt CloudGuardReadOnlyRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"
  
  ScannerIdentityPolicyArn:
    Description: Attach this policy to YOUR IAM user to allow it to access this role.
    Value: !Ref CloudGuardScannerIdentityPolicy
    Export:
      Name: !Sub "${AWS::StackName}-PolicyArn"
  
  StackName:
    Description: Name of this CloudFormation stack
    Value: !Ref AWS::StackName
  
  ExternalId:
    Description: External ID used for secure cross-account access
    Value: 'CloudGuard-Scanner-Validation'
