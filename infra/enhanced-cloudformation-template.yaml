AWSTemplateFormatVersion: '2010-09-09'
Description: Enhanced Read-only role for CloudGuard - ALL 20 Vulnerability Checks

Parameters:
  ScannerAccountId:
    Type: String
    Description: "The AWS Account ID where the Scanner Runtime Role is deployed"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: "Must be a 12-digit AWS Account ID"
    Default: "859561299880"

Resources:
  CloudGuardReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CloudGuardReadOnlyRole-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${ScannerAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": "CloudGuard-Scanner-Validation"
      
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/SecurityAudit"
      
      Policies:
        - PolicyName: CloudGuardEnhancedScanningPolicy-AllChecks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ==========================================
              # ORIGINAL CHECKS (1-6)
              # ==========================================
              
              # IAM Checks (1-3, 11-12)
              - Sid: IAMReadPermissions
                Effect: Allow
                Action:
                  - "iam:ListUsers"
                  - "iam:ListMFADevices"
                  - "iam:GetUser"
                  - "iam:ListPolicies"
                  - "iam:GetPolicy"
                  - "iam:GetPolicyVersion"
                  - "iam:ListAttachedUserPolicies"
                  - "iam:ListUserPolicies"
                  - "iam:GetUserPolicy"
                  - "iam:ListRoles"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:ListAttachedRolePolicies"
                Resource: "*"
              
              # S3 Checks (4)
              - Sid: S3ReadPermissions
                Effect: Allow
                Action:
                  - "s3:ListAllMyBuckets"
                  - "s3:GetBucketLocation"
                  - "s3:GetBucketPublicAccessBlock"
                  - "s3:GetBucketPolicyStatus"
                  - "s3:GetBucketAcl"
                  - "s3:GetBucketPolicy"
                  - "s3:GetEncryptionConfiguration"
                Resource: "*"
              
              # VPC & Network (5)
              - Sid: VPCReadPermissions
                Effect: Allow
                Action:
                  - "ec2:DescribeVpcs"
                  - "ec2:DescribeFlowLogs"
                  - "ec2:DescribeSecurityGroups"
                  - "ec2:DescribeNetworkAcls"
                  - "ec2:DescribeRouteTables"
                  - "ec2:DescribeSubnets"
                Resource: "*"
              
              # GuardDuty (6)
              - Sid: GuardDutyReadPermissions
                Effect: Allow
                Action:
                  - "guardduty:ListDetectors"
                  - "guardduty:GetDetector"
                  - "guardduty:ListFindings"
                Resource: "*"
              
              # ==========================================
              # NEW ENHANCED CHECKS (7-20)
              # ==========================================
              
              # EBS Checks (7, 8)
              - Sid: EBSSecurityChecks
                Effect: Allow
                Action:
                  - "ec2:DescribeVolumes"
                  - "ec2:DescribeSnapshots"
                  - "ec2:DescribeSnapshotAttribute"
                  - "ec2:DescribeVolumeAttribute"
                Resource: "*"
              
              # RDS Checks (9, 18)
              - Sid: RDSSecurityChecks
                Effect: Allow
                Action:
                  - "rds:DescribeDBInstances"
                  - "rds:DescribeDBClusters"
                  - "rds:DescribeDBSecurityGroups"
                  - "rds:DescribeDBParameterGroups"
                  - "rds:DescribeDBSnapshots"
                  - "rds:DescribeDBSnapshotAttributes"
                Resource: "*"
              
              # ELB/ALB Checks (10)
              - Sid: LoadBalancerSecurityChecks
                Effect: Allow
                Action:
                  - "elasticloadbalancing:DescribeLoadBalancers"
                  - "elasticloadbalancing:DescribeListeners"
                  - "elasticloadbalancing:DescribeTargetGroups"
                  - "elasticloadbalancing:DescribeSSLPolicies"
                  - "elasticloadbalancing:DescribeLoadBalancerAttributes"
                Resource: "*"
              
              # Lambda Checks (15)
              - Sid: LambdaSecurityChecks
                Effect: Allow
                Action:
                  - "lambda:ListFunctions"
                  - "lambda:GetFunction"
                  - "lambda:GetFunctionConfiguration"
                  - "lambda:GetPolicy"
                  - "lambda:ListVersionsByFunction"
                Resource: "*"
              
              # CloudTrail Checks (13)
              - Sid: CloudTrailSecurityChecks
                Effect: Allow
                Action:
                  - "cloudtrail:DescribeTrails"
                  - "cloudtrail:GetTrailStatus"
                  - "cloudtrail:GetEventSelectors"
                  - "cloudtrail:ListTrails"
                  - "cloudtrail:LookupEvents"
                Resource: "*"
              
              # CloudWatch Logs (14)
              - Sid: CloudWatchLogsChecks
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                  - "logs:DescribeMetricFilters"
                  - "logs:ListTagsLogGroup"
                Resource: "*"
              
              # KMS Checks (16)
              - Sid: KMSSecurityChecks
                Effect: Allow
                Action:
                  - "kms:ListKeys"
                  - "kms:ListAliases"
                  - "kms:DescribeKey"
                  - "kms:GetKeyPolicy"
                  - "kms:GetKeyRotationStatus"
                  - "kms:ListResourceTags"
                Resource: "*"
              
              # AMI Checks (17)
              - Sid: AMISecurityChecks
                Effect: Allow
                Action:
                  - "ec2:DescribeImages"
                  - "ec2:DescribeImageAttribute"
                Resource: "*"
              
              # Secrets Manager & Parameter Store (19)
              - Sid: SecretsManagementChecks
                Effect: Allow
                Action:
                  - "secretsmanager:ListSecrets"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:GetResourcePolicy"
                  - "ssm:DescribeParameters"
                  - "ssm:GetParameters"
                  - "ssm:ListTagsForResource"
                Resource: "*"
              
              # AWS Inspector (20)
              - Sid: InspectorVulnerabilityChecks
                Effect: Allow
                Action:
                  - "inspector2:ListFindings"
                  - "inspector2:BatchGetAccountStatus"
                  - "inspector2:GetFindingsReportStatus"
                  - "inspector2:ListCoverage"
                  - "inspector2:GetConfiguration"
                Resource: "*"
              
              # Additional EC2 permissions for comprehensive checks
              - Sid: EC2EnhancedPermissions
                Effect: Allow
                Action:
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeInstanceAttribute"
                  - "ec2:DescribeRegions"
                  - "ec2:DescribeAvailabilityZones"
                  - "ec2:DescribeTags"
                Resource: "*"
              
              # STS for identity verification
              - Sid: STSIdentityVerification
                Effect: Allow
                Action:
                  - "sts:GetCallerIdentity"
                Resource: "*"

      Description: "Enhanced read-only role for CloudGuard scanner - supports all 20 vulnerability checks"
      
      Tags:
        - Key: CreatedBy
          Value: CloudGuard-Scanner-Enhanced
        - Key: Purpose
          Value: ComprehensiveVulnerabilityAssessment
        - Key: Version
          Value: "2.0"
        - Key: Coverage
          Value: "20-Vulnerability-Checks"

  CloudGuardScannerIdentityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'CloudGuard-Scanner-Identity-Policy-${AWS::StackName}'
      Description: 'Managed policy for the IAM User running the enhanced scanner'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt CloudGuardReadOnlyRole.Arn

Outputs:
  RoleArn:
    Description: The ARN of the enhanced role created for the scanner
    Value: !GetAtt CloudGuardReadOnlyRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"
  
  ScannerIdentityPolicyArn:
    Description: Attach this policy to YOUR IAM user to allow it to access this role
    Value: !Ref CloudGuardScannerIdentityPolicy
    Export:
      Name: !Sub "${AWS::StackName}-ScannerIdentityPolicyArn"
  
  StackName:
    Description: Name of this CloudFormation stack
    Value: !Ref AWS::StackName
  
  ExternalId:
    Description: External ID used for secure cross-account access
    Value: "CloudGuard-Scanner-Validation"
