name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  # Frontend validation
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: grc-platform/package-lock.json

      - name: Install all dependencies
        working-directory: grc-platform
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit
        working-directory: grc-platform/frontend

      - name: ESLint validation
        run: npm run lint
        working-directory: grc-platform/frontend

      - name: Run unit tests
        run: npm test -- --run --reporter=verbose
        working-directory: grc-platform/frontend

      - name: Build check
        run: npm run build
        working-directory: grc-platform/frontend

  # Backend services validation
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [controls, frameworks, policies, tprm, trust, audit, shared]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grc_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: grc_regression
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U grc_test -d grc_regression"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://grc_test:ci-test-password@127.0.0.1:5432/grc_regression
      GRC_TEST_DATABASE_URL: postgresql://grc_test:ci-test-password@127.0.0.1:5432/grc_regression

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: grc-platform/package-lock.json

      - name: Install all dependencies
        working-directory: grc-platform
        run: npm ci

      # Lifecycle scripts are disabled globally via .npmrc as a supply-chain
      # defense. The Prisma client is required for the per-service TS
      # compilation below, so generate it explicitly here.
      - name: Generate Prisma client
        working-directory: grc-platform
        run: npm run db:generate

      - name: Prepare persistence test database
        if: matrix.service == 'controls'
        working-directory: grc-platform
        run: npx prisma db push --schema services/shared/prisma/schema.prisma --skip-generate

      - name: Build shared module
        working-directory: grc-platform
        run: npm run build --workspace=@gigachad-grc/shared

      - name: TypeScript compilation check
        run: npx tsc --noEmit
        working-directory: grc-platform/services/${{ matrix.service }}

      - name: ESLint validation
        run: npm run lint --if-present -- --no-fix
        working-directory: grc-platform/services/${{ matrix.service }}

      - name: Run unit tests
        run: npm test -- --runInBand
        working-directory: grc-platform/services/${{ matrix.service }}

  # Security scanning - BLOCKING: PRs cannot merge with security issues
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: grc-platform/package-lock.json

      - name: Install dependencies
        working-directory: grc-platform
        run: npm ci

      - name: Run npm audit (BLOCKING)
        working-directory: grc-platform
        run: npm audit --audit-level=high
        # Security check is now blocking - no continue-on-error

      - name: Verify npm package signatures (BLOCKING)
        # Checks sigstore attestations for installed packages. Catches
        # package takeovers where a malicious version is published without
        # a valid signature from the maintainer's published key. Skips
        # gracefully for packages that have not yet enabled attestations.
        working-directory: grc-platform
        run: npm audit signatures

      - name: Run Trivy vulnerability scanner (BLOCKING)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # BLOCKING: Fail on HIGH/CRITICAL vulnerabilities
          format: 'table'
          ignore-unfixed: true # Only fail on vulnerabilities with available fixes

  # Docker build check
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [controls, frameworks, policies, tprm, trust, audit]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./grc-platform
          file: grc-platform/services/${{ matrix.service }}/Dockerfile
          push: false
          tags: grc-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1

  # Signed-JWT, tenant-boundary and RBAC regressions run in the backend job.
  # The old browser jobs relied on removed x-user-id/dev-auth bypasses; a real
  # Keycloak browser fixture is required before those suites can run in CI.
  cloudguard:
    name: CloudGuard Python and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudguard_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: cloudguard_regression
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cloudguard_test -d cloudguard_regression"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      CLOUDGUARD_TEST_DATABASE_URL: postgresql://cloudguard_test:ci-test-password@127.0.0.1:5432/cloudguard_regression
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply CloudGuard migrations
        run: |
          for migration in db/init/*.sql; do
            psql "$CLOUDGUARD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test CloudGuard sign-in flow
        run: node --test frontend/tests/*.test.cjs
      - name: Run Python tests
        run: python -m pytest backend/tests -q

  # Final status check
  status:
    name: Validation Status
    runs-on: ubuntu-latest
    needs: [frontend, backend, security, docker, cloudguard]
    if: always()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Check all jobs status
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required validation job did not succeed ($result)"
              exit 1
            fi
          done
          echo "All required validation jobs passed"
