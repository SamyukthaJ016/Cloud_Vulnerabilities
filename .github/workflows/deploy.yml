name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Image version to deploy (leave empty for the triggering commit)'
        required: false
        type: string

  workflow_run:
    workflows: ["Build and Push"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

concurrency:
  group: grc-deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Terraform plan
  plan:
    name: Terraform Plan
    if: vars.GRC_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: grc-platform/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_TABLE: ${{ vars.TF_STATE_TABLE }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || env.AWS_REGION }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_STATE_TABLE" ]; then
            echo "::error::Configure TF_STATE_BUCKET and TF_STATE_TABLE before enabling deployments"
            exit 1
          fi
          # The repository's example backend is commented out. CI requires
          # persistent, locked state instead of a fresh local state each run.
          cat > backend.ci.tf <<'HCL'
          terraform {
            backend "s3" {}
          }
          HCL
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=grc/$DEPLOY_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_TABLE" \
            -backend-config="encrypt=true"

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION="${REQUESTED_VERSION:-sha-${BUILD_SHA:0:7}}"
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        id: plan
        working-directory: grc-platform/terraform
        run: |
          set +e
          terraform plan \
            -var="environment=${{ inputs.environment || 'staging' }}" \
            -var="image_tag=${{ steps.version.outputs.version }}" \
            -out=tfplan \
            -detailed-exitcode
          PLAN_EXIT=$?
          set -e
          echo "exitcode=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$PLAN_EXIT" != 0 ] && [ "$PLAN_EXIT" != 2 ]; then
            exit "$PLAN_EXIT"
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: grc-platform/terraform/tfplan
          retention-days: 5

  # Terraform apply (requires approval for production)
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.plan_exit_code == '2'
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.outputs.outputs.app_url }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: grc-platform/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_TABLE: ${{ vars.TF_STATE_TABLE }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || env.AWS_REGION }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_STATE_TABLE" ]; then
            echo "::error::Configure TF_STATE_BUCKET and TF_STATE_TABLE before enabling deployments"
            exit 1
          fi
          # The repository's example backend is commented out. CI requires
          # persistent, locked state instead of a fresh local state each run.
          cat > backend.ci.tf <<'HCL'
          terraform {
            backend "s3" {}
          }
          HCL
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=grc/$DEPLOY_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_TABLE" \
            -backend-config="encrypt=true"

      - name: Download plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: grc-platform/terraform

      - name: Terraform Apply
        working-directory: grc-platform/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get outputs
        id: outputs
        working-directory: grc-platform/terraform
        run: |
          echo "app_url=$(terraform output -raw app_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

  # Update ECS services
  deploy-services:
    name: Deploy ECS Services
    runs-on: ubuntu-latest
    needs: apply
    environment: ${{ inputs.environment || 'staging' }}

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service: [controls, frameworks, policies, tprm, trust, audit]
      max-parallel: 2

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION="${REQUESTED_VERSION:-sha-${BUILD_SHA:0:7}}"
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          CLUSTER_NAME="grc-${{ inputs.environment || 'staging' }}-cluster"
          SERVICE_NAME="grc-${{ inputs.environment || 'staging' }}-${{ matrix.service }}"

          echo "Updating $SERVICE_NAME in cluster $CLUSTER_NAME..."

          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for service stability
        run: |
          CLUSTER_NAME="grc-${{ inputs.environment || 'staging' }}-cluster"
          SERVICE_NAME="grc-${{ inputs.environment || 'staging' }}-${{ matrix.service }}"

          echo "Waiting for $SERVICE_NAME to stabilize..."

          aws ecs wait services-stable \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME

  # Deployment summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [apply, deploy-services]
    if: always()

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Create summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment || 'staging' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ inputs.version || 'latest' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Apply | ${{ needs.apply.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service Deployment | ${{ needs.deploy-services.result }} |" >> $GITHUB_STEP_SUMMARY
