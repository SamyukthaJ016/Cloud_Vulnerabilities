name: Convert Markdown to PDF

on:
  workflow_dispatch:
  push:
    paths:
      - '**.md'

jobs:
  convert-md-to-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Convert all MD files to PDF
        run: |
          find . -name "*.md" \
            ! -path "./.git/*" \
            ! -name "CHANGELOG.md" \
            ! -name "LICENSE.md" | while read mdfile; do
              dir=$(dirname "$mdfile")
              base=$(basename "$mdfile" .md)
              echo "Converting: $mdfile → $dir/$base.pdf"
              pandoc "$mdfile" \
                -o "$dir/$base.pdf" \
                --pdf-engine=xelatex \
                -V geometry:margin=1in \
                -V fontsize=12pt \
                -V linkcolor=blue \
                --standalone || echo "Warning: Failed to convert $mdfile"
          done

      - name: Commit and push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "**/*.pdf"
          git diff --cached --quiet || git commit -m "chore: convert markdown files to PDF [skip ci]"
          git push
