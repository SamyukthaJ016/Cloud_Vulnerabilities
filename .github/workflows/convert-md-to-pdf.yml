name: Convert Markdown to PDF

on:
  workflow_dispatch:
  push:
    paths:
      - '**.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert-md-to-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Convert all MD files to PDF
        run: |
          find . -name "*.md" \
            ! -path "./.git/*" \
            ! -name "CHANGELOG.md" \
            ! -name "LICENSE.md" | while read mdfile; do
              dir=$(dirname "$mdfile")
              base=$(basename "$mdfile" .md)
              echo "Converting: $mdfile → $dir/$base.pdf"
              pandoc "$mdfile" \
                -o "$dir/$base.pdf" \
                --pdf-engine=xelatex \
                -V geometry:margin=1in \
                -V fontsize=12pt \
                -V linkcolor=blue \
                --standalone || echo "Warning: Failed to convert $mdfile"
          done

      - name: Commit and push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No PDFs to commit."
          else
            git commit -m "chore: convert markdown files to PDF [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
