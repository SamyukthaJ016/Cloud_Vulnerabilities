name: Convert All Markdown to PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pandoc and PDF Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Create Output Directory
        run: mkdir -p pdf-output

      - name: Find and Convert All MD Files
        run: |
          # This safely finds all .md files, ignoring the output directory itself
          find . -type f -name "*.md" -not -path "./pdf-output/*" -not -path "./.github/*" | while read -r file; do
            # Generate a clean output name inside the pdf-output folder
            base_name=$(basename "$file" .md)
            echo "Converting $file to pdf-output/$base_name.pdf"
            
            # Run the conversion
            pandoc "$file" -o "pdf-output/$base_name.pdf" --pdf-engine=wkhtmltopdf
          done

      - name: Upload PDFs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-converted-pdfs
          path: pdf-output/
