name: Convert All Markdown to PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Output Directory
        run: mkdir -p pdf-output

      - name: Convert All Markdown Files
        uses: fi3ework/markdown-to-pdf-action@v1
        with:
          # This action safely accepts glob patterns to find all MD files
          input: ./
          output: ./pdf-output
          # Exclude the output directory so it doesn't loop into itself
          exclude: ./pdf-output

      - name: Upload PDFs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-converted-pdfs
          path: pdf-output/
